plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Учебная лаборатория AI-разработки на Java: клиент OpenCode API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-liquibase'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'com.microsoft.playwright:playwright:1.65.0'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'e2e'
    }
}

tasks.register('playwrightInstall', JavaExec) {
    group = 'verification'
    description = 'Installs the Chromium build used by the Playwright E2E tests'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install', 'chromium']
}

tasks.register('e2e', Test) {
    group = 'verification'
    description = 'Runs Playwright E2E tests (JUnit tag "e2e"); add -Pheaded to watch the browser'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
    }
    dependsOn 'playwrightInstall'
    systemProperty 'e2e.headed',
            providers.gradleProperty('headed').map { it.isEmpty() ? 'true' : it }.getOrElse('false')
    // The headed flag is not a tracked input: always re-run so -Pheaded actually takes effect.
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named('test')
}
