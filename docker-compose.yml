services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: java-ai-agent-dev-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-devagent}
      POSTGRES_USER: ${DB_OWNER_USERNAME:-owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?DB_READONLY_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
