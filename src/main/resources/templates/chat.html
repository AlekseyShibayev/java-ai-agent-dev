<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Чат</title>
</head>
<body>
<main id="chat" th:attr="data-session-id=${sessionId}">
    <div id="connection" class="banner" role="status" hidden>Нет связи</div>
    <div id="unavailable" class="banner" role="alert" th:if="${unavailable}">OpenCode недоступен</div>

    <section id="thread" aria-live="polite">
        <p id="empty" class="empty" th:unless="${activeRunId}">Начните диалог</p>
        <div th:if="${activeRunId}" class="run" th:attr="data-run-id=${activeRunId}"></div>
    </section>

    <form id="composer" method="post" action="/chat/messages">
        <label for="message">Сообщение</label>
        <textarea id="message" name="text" rows="3" required></textarea>
        <button id="send" type="submit">Отправить</button>
        <button id="stop" type="button" disabled>Stop</button>
    </form>
</main>
</body>
</html>
