<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="answer(runId)" class="answer" hx-ext="sse"
     th:attr="sse-connect='/chat/runs/' + ${runId} + '/events'">
    <span class="answer-text" sse-swap="text" hx-swap="beforeend"></span>
    <span class="answer-state" sse-swap="state" hx-swap="none"></span>
</div>
</body>
</html>
