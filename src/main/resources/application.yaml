# Встроенные дефолты. Секретов здесь быть не должно.
# Реальные значения (токены, пароли) кладутся в ./application.yaml рядом
# с запущенным приложением — этот файл в .gitignore.

spring:
  application:
    name: telegram-ai-dev-agent

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

opencode:
  base-url: ${OPENCODE_BASE_URL:}
  binary: ${OPENCODE_BIN:opencode}
  password: ${OPENCODE_PASSWORD:}
  directory: ${OPENCODE_DIRECTORY:}
  provider: ${OPENCODE_PROVIDER:opencode-go}
  model: ${OPENCODE_MODEL:deepseek-v4.1-flash}
